[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Mega_projekt"
version = "0.1.1"
requires-python = ">=3.12"
description = "Letterboxd stats, watchlist intersecter"
authors = [
    { name = "The French 75", email = "karoljedi09@gmail.com" }
]
dependencies = [
    "django>=5.2",
    "django-crispy-forms>=2.6",
    "crispy-bootstrap5>=2026.3",
    "pandas",
    "numpy",
    "requests",
    "beautifulsoup4",
    "aiohttp",
    "uvicorn",
    "whitenoise",
]
[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["letterboxd_stats*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["letterboxd_stats"]