[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django_blog"
version = "0.1.1"
requires-python = ">=3.12"
description = "Nauka Django z tutorialu Corey Schafer na youtube"
authors = [
    { name = "Karol Bartnicki", email = "karoljedi09@gmail.com" }
]
dependencies = [
    "django>=5.2",
    "django-crispy-forms>=2.6",
    "crispy-bootstrap5>=2026.3",
]
[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blog*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM", "TCH", "PTH", "RUF"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["blog"]