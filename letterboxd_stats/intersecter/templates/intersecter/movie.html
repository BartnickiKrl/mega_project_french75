{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letterbox Intersecter</title>
    <link rel="stylesheet" href="{% static 'intersecter/base.css' %}">
</head>
<body>

    <main class="dashboard">

        <header class="main-header">
            <h1>Letterboxd <a class="highlight" href="{% url 'intersect-home' %}">Intersecter</a></h1>
        </header>

            <div class="box-poster">
                <label>Best film for today</label>
                <div class="poster-frame">
                    <img src="{{ poster_url }}" alt="Poster">
                </div>
                <h1>{{ title }}, {{ year }}</h1>
            </div>
        <form action="{% url 'intersect-movie' %}" method="POST" class="app-container" onsubmit="return disableButton(this)">
            {% csrf_token %}
            
            <div class="box-genre">
                <label>Change genre or try the same one again</label>
                <select name="genre" required>
                    <option value="random" selected>Random</option>
                    <option value="Action">Action</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Animation">Animation</option>
                    <option value="Aomedy">Comedy</option>
                    <option value="Crime">Crime</option>
                    <option value="Documentary">Documentary</option>
                    <option value="Drama">Drama</option>
                    <option value="Family">Family</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="History">History</option>
                    <option value="Horror">Horror</option>
                    <option value="Music">Music</option>
                    <option value="Mystery">Mystery</option>
                    <option value="Romance">Romance</option>
                    <option value="Science-fiction">Science Fiction</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Tv Movie">TV Movie</option>
                    <option value="War">War</option>
                    <option value="Western">Western</option>
                </select>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Reroll</button>
                
        </form>
    </main>
</body>
</html>
